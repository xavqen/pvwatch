<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>PVwatch — Library</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
</head>

<body>
    <header class="topbar"><a class="brand" href="/"><span class="logo">▶</span>PVwatch</a>
        <nav class="nav"><a href="/library">Library</a><a href="/login">Creator Dashboard</a><button
                id="themeBtn">☾</button></nav>
        <div class="nav-mobile"><a class="btn small" href="/login">Creator</a><button id="themeBtn">☾</button></div>
    </header>
    <main class="shell">
        <section class="hero">
            <div>
                <p class="eyebrow">PUBLIC LIBRARY</p>
                <h1>All videos</h1>
                <p class="muted">Browse every published PVwatch video.</p>
            </div>
        </section>
        <section class="panel"><input id="search" class="search" placeholder="Search titles…">
            <div id="list" class="video-list"></div>
        </section>
    </main>
    <div id="toast" class="toast hidden"></div>
    <script src="/common.js"></script>
    <script>let all = []; function render() { const q = $('search').value.toLowerCase().trim(); const vs = all.filter(v => !q || (`${v.title} ${v.description}`).toLowerCase().includes(q)); $('list').innerHTML = vs.map(v => `<article class="video-item" onclick="location.href='/watch/${v.id}'"><img class="thumb" src="${v.thumbnail_url || ''}" onerror="this.style.display='none'"><div><div class="video-title">${esc(v.title)}</div><div class="video-meta">${fmtTime(v.duration_seconds)} · ${Number(v.view_count || 0)} views · ${fmtSize(v.size_bytes)}</div><div class="video-meta" style="margin-top:6px">${esc(v.description || '')}</div></div></article>`).join('') || '<div class="muted">No matching videos.</div>' } async function init() { all = await jsonFetch('/api/videos'); render() } $('search').oninput = render; init();</script>
</body>

</html>
