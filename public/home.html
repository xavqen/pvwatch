<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PVwatch — Video Platform</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><a class="brand" href="/"><span class="logo">▶</span>PVwatch</a><nav class="nav"><a href="/library">Browse</a><a href="/login">Creator Dashboard</a><button id="themeBtn">☾</button></nav><div class="nav-mobile"><a class="btn small" href="/library">Browse</a><button id="themeBtn">☾</button></div></header><main class="shell"><section class="hero"><div><p class="eyebrow">LONG-FORM VIDEO</p><h1>Watch what matters.</h1><p class="muted">A clean, fast video platform built around long videos, cloud storage and a distraction-free player.</p></div><span class="pill">PVwatch</span></section><section class="panel"><div class="section-head"><div><h2>Latest videos</h2><div class="sub">Public library</div></div><div style="display:flex;gap:8px"><a class="btn small primary" href="/upload">Upload video</a><a class="btn small" href="/library">Open library</a></div></div><div id="latest" class="video-list"></div></section></main><div id="toast" class="toast hidden"></div><script src="/common.js"></script><script>async function load(){try{const vs=await jsonFetch('/api/videos',{headers:{}});$('latest').innerHTML=vs.slice(0,8).map(v=>`<article class="video-item" onclick="location.href='/watch/${v.id}'"><img class="thumb" src="${v.thumbnail_url||''}" onerror="this.style.display='none'"><div><div class="video-title">${esc(v.title)}</div><div class="video-meta">${fmtTime(v.duration_seconds)} · ${Number(v.view_count||0)} views</div></div></article>`).join('')||'<div class="muted">No videos yet.</div>'}catch(e){$('latest').innerHTML='<div class="muted">Unable to load videos.</div>'}}load();</script></body></html>
